name: Open Source Autonomous Bug Hunter

on:
  schedule:
    # 自动全无人值守高频定时巡检：每 30 分钟自动唤醒一次，扫描开源热门项目
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      query:
        description: 'GitHub Search query for issues'
        required: false
        type: string
        default: 'is:open is:issue language:python stars:>1000 label:"good first issue"'
      min_stars:
        description: 'Minimum repository stars'
        required: false
        type: number
        default: 1000
      target_repos:
        description: 'Specific target repositories (space separated, e.g. pallets/flask). If empty, uses search query'
        required: false
        type: string
        default: ''
      auto_pr:
        description: 'Actually submit PRs to upstream (true) or dry-run only (false)'
        required: true
        type: boolean
        default: true
      max_pr:
        description: 'Maximum PRs to submit in this run'
        required: true
        type: number
        default: 1

permissions:
  contents: write
  pull-requests: write

jobs:
  hunt_and_fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Configure Git Author
        run: |
          git config --global user.name "cf3901646"
          git config --global user.email "cf3901646@users.noreply.github.com"

      - name: Run Open Source Bug Hunter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          SEARCH_QUERY: ${{ inputs.query || 'is:open is:issue language:python stars:>1000 label:"good first issue"' }}
          MIN_STARS: ${{ inputs.min_stars || 1000 }}
          TARGET_REPOS: ${{ inputs.target_repos }}
          MAX_PR: ${{ inputs.max_pr || 1 }}
          AUTO_PR: ${{ github.event_name == 'schedule' || inputs.auto_pr }}
        run: |
          ARGS="--max-pr $MAX_PR --min-stars $MIN_STARS --exclude haidian open-city-ai"
          if [ "$AUTO_PR" = "true" ]; then
            ARGS="$ARGS --auto-pr"
          fi
          if [ -n "$TARGET_REPOS" ]; then
            python scripts/open_source_hunter.py --repos $TARGET_REPOS $ARGS
          else
            python scripts/open_source_hunter.py --query "$SEARCH_QUERY" $ARGS
          fi
