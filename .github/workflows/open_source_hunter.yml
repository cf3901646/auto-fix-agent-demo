name: Open Source Autonomous Bug Hunter

on:
  schedule:
    # 自动全无人值守定时巡检：每 6 小时自动唤醒一次，扫描开源热门项目
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      query:
        description: 'GitHub Search query for issues'
        required: false
        type: string
        default: 'is:open is:issue label:"good first issue" language:python'
      target_repos:
        description: 'Specific target repositories (space separated, e.g. pallets/flask). If empty, uses search query'
        required: false
        type: string
        default: ''
      auto_pr:
        description: 'Actually submit PRs to upstream (true) or dry-run only (false)'
        required: true
        type: boolean
        default: true
      max_pr:
        description: 'Maximum PRs to submit in this run'
        required: true
        type: number
        default: 1

permissions:
  contents: write
  pull-requests: write

jobs:
  hunt_and_fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Git Author
        run: |
          git config --global user.name "cf3901646"
          git config --global user.email "cf3901646@users.noreply.github.com"

      - name: Run Open Source Bug Hunter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          QUERY="${{ inputs.query || 'is:open is:issue label:\"good first issue\" language:python' }}"
          MAX_PR="${{ inputs.max_pr || 1 }}"
          AUTO_PR_FLAG="${{ inputs.auto_pr != false && '--auto-pr' || '' }}"
          
          if [ -n "${{ inputs.target_repos }}" ]; then
            python scripts/open_source_hunter.py --repos ${{ inputs.target_repos }} --exclude haidian open-city-ai --max-pr $MAX_PR $AUTO_PR_FLAG
          else
            python scripts/open_source_hunter.py --query "$QUERY" --exclude haidian open-city-ai --max-pr $MAX_PR $AUTO_PR_FLAG
          fi
